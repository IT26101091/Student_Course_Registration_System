<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Course Registration</title>
    <!-- Links to your global stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="auth-container">
    <h2>System Login</h2>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username / Student ID</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="primary-btn">Login</button>
        <p id="errorMessage" style="color: red; display: none;"></p>
    </form>

    <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(event) {
        event.preventDefault(); // Prevents page reload

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorText = document.getElementById('errorMessage');

        try {
            // Calls your Javalin AuthManager route
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();

            if (result.success) {
                // Store the ID globally for the browser session
                localStorage.setItem("userId", result.studentId);
                localStorage.setItem("role", result.role);

                // Redirect based on the database role
                if (result.role === "admin") {
                    window.location.href = "queue.html";
                } else {
                    window.location.href = "profile.html";
                }
            } else {
                errorText.innerText = result.message || "Invalid credentials.";
                errorText.style.display = "block";
            }
        } catch (error) {
            console.error("Error logging in:", error);
            errorText.innerText = "Server error. Is your Java backend running?";
            errorText.style.display = "block";
        }
    });
</script>
</body>
</html>
